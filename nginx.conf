# nginx.conf

# 依最終送出的檔案決定快取策略。
# index.html 是入口，必須每次重新驗證：它裡面寫著當次建置的雜湊檔名，
# 一旦被瀏覽器快取住，改版後就會一直去要已經不存在的舊檔名而卡在舊版。
# /assets/ 底下的檔名由 Vite 加上內容雜湊，內容變更等於檔名變更，可安心長快取。
map $uri $gt_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
}

server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # 放在 server 層，讓三個 location 都繼承（各 location 未自行宣告 add_header）
    add_header Cache-Control $gt_cache_control always;

    # 上游反向代理可能保留 /startupchallenge2026 或 /2026 前綴，這裡剝除後照常服務
    location = /startupchallenge2026 {
        return 301 /startupchallenge2026/;
    }

    location /startupchallenge2026/ {
        rewrite ^/startupchallenge2026/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /2026 {
        return 301 /2026/;
    }

    location /2026/ {
        rewrite ^/2026/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
