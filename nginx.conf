# nginx.conf
server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # 上游反向代理可能保留 /startupchallenge2026 或 /2026 前綴，這裡剝除後照常服務
    location = /startupchallenge2026 {
        return 301 /startupchallenge2026/;
    }

    location /startupchallenge2026/ {
        rewrite ^/startupchallenge2026/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /2026 {
        return 301 /2026/;
    }

    location /2026/ {
        rewrite ^/2026/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
